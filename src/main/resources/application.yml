spring:
  application:
    name: joing
  profiles:
    active: dev
    include:
      - database
      - security
  config:
    import: 'optional:aws-parameterstore:/joing/be/${spring.profiles.active}/'
  cloud:
    aws:
      region:
        static: ap-northeast-2

ai:
  url:
    gen: ${ai.url.gen}
    rec: ${ai.url.rec}

app:
  frontend:
    url: ${frontend.url}

logging:
  level:
    org:
      springframework:
        security: DEBUG
